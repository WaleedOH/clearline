<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ClearLine · Phone camera</title>
    <style>
      :root { color-scheme: dark; --accent: #3aa0ff; --muted: #8a949e; --bad: #ff5d5d; --ok: #3ccf7a; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: #0f1215; color: #e6e9ec;
        font: 16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
      }
      main { max-width: 560px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 20px; margin: 4px 0 2px; }
      p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
      label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
      input {
        font: inherit; color: inherit; background: #161a1f; border: 1px solid #262c33;
        border-radius: 8px; padding: 12px;
      }
      button {
        width: 100%; font: inherit; font-weight: 600; padding: 14px; border-radius: 8px; border: 0;
        background: var(--accent); color: #04121f; cursor: pointer;
      }
      button.stop { background: #2a3038; color: #e6e9ec; }
      video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; border-radius: 8px; display: block; }
      #status { margin: 10px 0 14px; font-size: 14px; }
      #status.ok { color: var(--ok); }
      #status.bad { color: var(--bad); }
      .tip { font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>ClearLine phone camera</h1>
      <p>Point this phone at the area to watch and keep it still. It sends one picture a second to the control room.</p>

      <form id="join">
        <label>Camera name <input name="name" value="Phone 1" maxlength="40"></label>
        <label>Join code (shown in the control room) <input name="code" inputmode="numeric" pattern="[0-9]{4}" required></label>
        <button>Start camera</button>
      </form>

      <section id="live" hidden>
        <video id="video" playsinline muted></video>
        <div id="status">Starting…</div>
        <button id="stop" class="stop">Stop</button>
        <p class="tip">Prop the phone up so it doesn't move. If it moves, set the clean picture again in the control room.</p>
      </section>
    </main>
    <script type="module" src="/src/phone/camera.ts"></script>
  </body>
</html>
